# Optional site login. Apply only when explicitly opting into website access control.
services:
  caddy:
    environment:
      JEV_SITE_USER: ${JEV_SITE_USER:?Set the optional site username}
      JEV_SITE_PASSWORD_HASH: ${JEV_SITE_PASSWORD_HASH:?Set a bcrypt hash generated by caddy hash-password}
    volumes:
      - ./deploy/Caddy.auth.example:/etc/caddy/Caddyfile:ro
