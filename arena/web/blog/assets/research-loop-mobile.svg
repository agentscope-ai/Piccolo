<svg xmlns="http://www.w3.org/2000/svg" class="architecture-canvas" viewBox="0 0 400 1120" role="img" aria-labelledby="research-loop-mobile-title research-loop-mobile-desc">
<title id="research-loop-mobile-title">How feedback becomes the next experiment</title><desc id="research-loop-mobile-desc">Diagnose a capability gap, specify a proposal, build and evaluate candidates, and carry forward useful checkpoints, recipes and findings. Human researchers set the objectives, permitted data and budget. The results inform the next proposal.</desc>
<defs><marker id="research-loop-mobile-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#8b7964" stroke-width="1.4" stroke-linejoin="round"/></marker></defs>
<style>.architecture-canvas text{font-family:Inter,Arial,sans-serif;fill:#46453c;font-weight:400}.architecture-canvas .label{font-size:14px}.architecture-canvas .small{font-size:12px;fill:#7f786a}.architecture-canvas .tiny{font-size:11px;fill:#7f786a}.architecture-canvas .title{font-size:17px;font-weight:550;letter-spacing:-.3px}.architecture-canvas .number{font-size:35px;fill:#8f5e3f;letter-spacing:-1px}.architecture-canvas .stat{font-size:17px;fill:#70583f}.architecture-canvas .eyebrow{font-size:10px;font-weight:600;letter-spacing:1.4px;fill:#8c735b}.architecture-canvas .mono{font-size:13px;font-family:ui-monospace,monospace;fill:#556964}.architecture-canvas .box{fill:#fbf9f3;stroke:#cfc7b8;stroke-width:1.2}.architecture-canvas .sage{fill:#f0f4ed;stroke:#a7b49d;stroke-width:1.2}.architecture-canvas .blue{fill:#eff4f3;stroke:#a0b5b6;stroke-width:1.2}.architecture-canvas .sand{fill:#faf2e6;stroke:#c7ac86;stroke-width:1.2}.architecture-canvas .neutral{fill:#f3f0e9;stroke:#bdb7a7;stroke-width:1.2}.architecture-canvas .inner{fill:#fffdf8;stroke:#dbd4c6;stroke-width:1}.architecture-canvas .connector{fill:none;stroke:#8b7964;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.architecture-canvas .dashed{fill:none;stroke:#9b9587;stroke-width:1.2;stroke-dasharray:5 5;stroke-linecap:round}.architecture-canvas .rule{stroke:#ddd6c8;stroke-width:1}.architecture-canvas .glyph{fill:none;stroke:#566968;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.architecture-canvas .stage-frame{transition:stroke .2s,fill .2s}.architecture-canvas .stage-frame.is-active{stroke:#a56440;stroke-width:2.3;fill:#f8ecdc}.architecture-canvas .label{font-size:17px}.architecture-canvas .small{font-size:16px}.architecture-canvas .title{font-size:19px}.architecture-canvas .stat{font-size:17px}.architecture-canvas .eyebrow{font-size:11px;letter-spacing:1.1px}</style>
<text x="20" y="25" class="eyebrow" text-anchor="start">A RESEARCH ROUND</text><rect x="20" y="43" width="360" height="65" rx="12" class="inner" /><text x="40" y="69" class="label" text-anchor="start">Human: objectives, data scope</text><text x="40" y="94" class="label" text-anchor="start">and research budget</text><rect x="20" y="128" width="360" height="200" rx="12" class="blue" /><text x="40" y="154" class="eyebrow" text-anchor="start">01</text><text x="40" y="182" class="title" text-anchor="start">Diagnose the gap</text><text x="40" y="218" class="label" text-anchor="start">Inspect errors and learning signals.</text><text x="40" y="241" class="label" text-anchor="start">Review the affected data slice.</text><path d="M40 280H360" class="rule" /><text x="40" y="309" class="stat" text-anchor="start">Evidence to investigate</text><path d="M200 336V352" class="connector" marker-end="url(#research-loop-mobile-arrow)"/><rect x="20" y="360" width="360" height="200" rx="12" class="sand" /><text x="40" y="386" class="eyebrow" text-anchor="start">02</text><text x="40" y="414" class="title" text-anchor="start">Specify an experiment</text><text x="40" y="450" class="label" text-anchor="start">Choose data changes and training</text><text x="40" y="473" class="label" text-anchor="start">settings. Name the parent model</text><text x="40" y="496" class="label" text-anchor="start">and comparison.</text><path d="M40 512H360" class="rule" /><text x="40" y="541" class="stat" text-anchor="start">A testable proposal</text><path d="M200 568V584" class="connector" marker-end="url(#research-loop-mobile-arrow)"/><rect x="20" y="592" width="360" height="200" rx="12" class="neutral" /><text x="40" y="618" class="eyebrow" text-anchor="start">03</text><text x="40" y="646" class="title" text-anchor="start">Build, train and evaluate</text><text x="40" y="682" class="label" text-anchor="start">Create the data version and train.</text><text x="40" y="705" class="label" text-anchor="start">Check target and retained</text><text x="40" y="728" class="label" text-anchor="start">capabilities.</text><path d="M40 744H360" class="rule" /><text x="40" y="773" class="stat" text-anchor="start">Results for each candidate</text><path d="M200 800V816" class="connector" marker-end="url(#research-loop-mobile-arrow)"/><rect x="20" y="824" width="360" height="200" rx="12" class="sage" /><text x="40" y="850" class="eyebrow" text-anchor="start">04</text><text x="40" y="878" class="title" text-anchor="start">Choose what to carry forward</text><text x="40" y="914" class="label" text-anchor="start">Compare checkpoints and task results.</text><text x="40" y="937" class="label" text-anchor="start">Keep useful recipes and failed</text><text x="40" y="960" class="label" text-anchor="start">attempts.</text><path d="M40 976H360" class="rule" /><text x="40" y="1005" class="stat" text-anchor="start">Starting points for the next round</text><text x="20" y="1056" class="label" text-anchor="start">Results inform the next proposal.</text><text x="20" y="1082" class="label" text-anchor="start">Procedure only; no measured gains.</text><path d="M380 1042V1102H8V218H14" class="connector" marker-end="url(#research-loop-mobile-arrow)"/></svg>
