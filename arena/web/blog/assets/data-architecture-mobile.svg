<svg xmlns="http://www.w3.org/2000/svg" class="architecture-canvas" viewBox="0 0 400 994" role="img" aria-labelledby="data-architecture-mobile-title data-architecture-mobile-desc">
<title id="data-architecture-mobile-title">From source records to a training recipe</title><desc id="data-architecture-mobile-desc">Collect source records and environment tasks, check that the decisions are valid, then organize them with a shared schema and semantic tags. The record provides supervision; its tags connect learning feedback to future data selection.</desc>
<defs><marker id="data-architecture-mobile-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#8b7964" stroke-width="1.4" stroke-linejoin="round"/></marker></defs>
<style>.architecture-canvas text{font-family:Inter,Arial,sans-serif;fill:#46453c;font-weight:400}.architecture-canvas .label{font-size:14px}.architecture-canvas .small{font-size:12px;fill:#7f786a}.architecture-canvas .tiny{font-size:11px;fill:#7f786a}.architecture-canvas .title{font-size:17px;font-weight:550;letter-spacing:-.3px}.architecture-canvas .number{font-size:35px;fill:#8f5e3f;letter-spacing:-1px}.architecture-canvas .stat{font-size:17px;fill:#70583f}.architecture-canvas .eyebrow{font-size:10px;font-weight:600;letter-spacing:1.4px;fill:#8c735b}.architecture-canvas .mono{font-size:13px;font-family:ui-monospace,monospace;fill:#556964}.architecture-canvas .box{fill:#fbf9f3;stroke:#cfc7b8;stroke-width:1.2}.architecture-canvas .sage{fill:#f0f4ed;stroke:#a7b49d;stroke-width:1.2}.architecture-canvas .blue{fill:#eff4f3;stroke:#a0b5b6;stroke-width:1.2}.architecture-canvas .sand{fill:#faf2e6;stroke:#c7ac86;stroke-width:1.2}.architecture-canvas .neutral{fill:#f3f0e9;stroke:#bdb7a7;stroke-width:1.2}.architecture-canvas .inner{fill:#fffdf8;stroke:#dbd4c6;stroke-width:1}.architecture-canvas .connector{fill:none;stroke:#8b7964;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.architecture-canvas .dashed{fill:none;stroke:#9b9587;stroke-width:1.2;stroke-dasharray:5 5;stroke-linecap:round}.architecture-canvas .rule{stroke:#ddd6c8;stroke-width:1}.architecture-canvas .glyph{fill:none;stroke:#566968;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.architecture-canvas .stage-frame{transition:stroke .2s,fill .2s}.architecture-canvas .stage-frame.is-active{stroke:#a56440;stroke-width:2.3;fill:#f8ecdc}.architecture-canvas .label{font-size:17px}.architecture-canvas .small{font-size:16px}.architecture-canvas .title{font-size:19px}.architecture-canvas .stat{font-size:17px}.architecture-canvas .eyebrow{font-size:11px;letter-spacing:1.1px}</style>
<rect x="20" y="20" width="360" height="196" rx="12" class="blue" /><text x="40" y="52" class="eyebrow" text-anchor="start">01 / COLLECT</text><text x="40" y="92" class="title" text-anchor="start">6.65M source records</text><text x="40" y="132" class="label" text-anchor="start">Classification, reasoning,</text><text x="40" y="158" class="label" text-anchor="start">preferences and tool use.</text><text x="40" y="184" class="label" text-anchor="start">Add tasks from environments.</text><rect x="20" y="252" width="360" height="196" rx="12" class="sand" /><text x="40" y="284" class="eyebrow" text-anchor="start">02 / CHECK</text><text x="40" y="324" class="title" text-anchor="start">Make the judgment valid</text><text x="40" y="364" class="label" text-anchor="start">Remove duplicates. Review answers,</text><text x="40" y="390" class="label" text-anchor="start">constraints and candidate bias.</text><text x="40" y="416" class="label" text-anchor="start">Check evaluation overlap.</text><rect x="20" y="484" width="360" height="196" rx="12" class="sage" /><text x="40" y="516" class="eyebrow" text-anchor="start">03 / ORGANIZE</text><text x="40" y="556" class="title" text-anchor="start">Select what to learn</text><text x="40" y="596" class="label" text-anchor="start">Use one decision schema.</text><text x="40" y="622" class="label" text-anchor="start">Tag the domain and required ability.</text><text x="40" y="648" class="label" text-anchor="start">Select a recipe for the next run.</text><path d="M200 224V244" class="connector" marker-end="url(#data-architecture-mobile-arrow)"/><path d="M200 456V476" class="connector" marker-end="url(#data-architecture-mobile-arrow)"/><rect x="20" y="720" width="360" height="192" rx="12" class="inner" /><text x="40" y="749" class="eyebrow" text-anchor="start">ONE RECORD, TWO USES</text><text x="40" y="785" class="label" text-anchor="start">State + candidates + labels</text><text x="40" y="812" class="title" text-anchor="start">→ Supervision</text><path d="M40 831H360" class="rule" /><text x="40" y="859" class="label" text-anchor="start">Tags + learning feedback</text><text x="40" y="886" class="title" text-anchor="start">→ Data selection</text><text x="20" y="946" class="label" text-anchor="start">Each experiment selects and processes</text><text x="20" y="972" class="label" text-anchor="start">its own recipe from the source pool.</text></svg>
