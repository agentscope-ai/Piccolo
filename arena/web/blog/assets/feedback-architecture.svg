<svg xmlns="http://www.w3.org/2000/svg" class="architecture-canvas" viewBox="0 0 1040 878" role="img" aria-labelledby="feedback-architecture-title feedback-architecture-desc">
<title id="feedback-architecture-title">Agentic Data Engineering architecture</title><desc id="feedback-architecture-desc">Human objectives, an agent and auditing guide an experiment loop. Recorded learning signals feed diagnosis, proposals execute in Sandbox, and candidate models, recipes and findings are retained in Panel. KL values are endpoints from the source figure, not interpolated curves.</desc>
<defs><marker id="feedback-architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#8b7964" stroke-width="1.4" stroke-linejoin="round"/></marker></defs>
<style>.architecture-canvas text{font-family:Inter,Arial,sans-serif;fill:#46453c;font-weight:400}.architecture-canvas .label{font-size:14px}.architecture-canvas .small{font-size:12px;fill:#7f786a}.architecture-canvas .tiny{font-size:11px;fill:#7f786a}.architecture-canvas .title{font-size:17px;font-weight:550;letter-spacing:-.3px}.architecture-canvas .number{font-size:35px;fill:#8f5e3f;letter-spacing:-1px}.architecture-canvas .stat{font-size:17px;fill:#70583f}.architecture-canvas .eyebrow{font-size:10px;font-weight:600;letter-spacing:1.4px;fill:#8c735b}.architecture-canvas .mono{font-size:13px;font-family:ui-monospace,monospace;fill:#556964}.architecture-canvas .box{fill:#fbf9f3;stroke:#cfc7b8;stroke-width:1.2}.architecture-canvas .sage{fill:#f0f4ed;stroke:#a7b49d;stroke-width:1.2}.architecture-canvas .blue{fill:#eff4f3;stroke:#a0b5b6;stroke-width:1.2}.architecture-canvas .sand{fill:#faf2e6;stroke:#c7ac86;stroke-width:1.2}.architecture-canvas .neutral{fill:#f3f0e9;stroke:#bdb7a7;stroke-width:1.2}.architecture-canvas .inner{fill:#fffdf8;stroke:#dbd4c6;stroke-width:1}.architecture-canvas .connector{fill:none;stroke:#8b7964;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.architecture-canvas .dashed{fill:none;stroke:#9b9587;stroke-width:1.2;stroke-dasharray:5 5;stroke-linecap:round}.architecture-canvas .rule{stroke:#ddd6c8;stroke-width:1}.architecture-canvas .glyph{fill:none;stroke:#566968;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.architecture-canvas .stage-frame{transition:stroke .2s,fill .2s}.architecture-canvas .stage-frame.is-active{stroke:#a56440;stroke-width:2.3;fill:#f8ecdc}
</style>
<rect x="280" y="18" width="188" height="90" rx="12" class="neutral" /><g transform="translate(295 42)" class="glyph"><circle cx="18" cy="10" r="8"/><path d="M2 36v-4c0-9 7-14 16-14s16 5 16 14v4"/></g><text x="342" y="53" class="title" text-anchor="start">Human</text><text x="295" y="91" class="small" text-anchor="start">Objectives · budget</text><rect x="492" y="18" width="188" height="90" rx="12" class="blue" /><g transform="translate(507 42)" class="glyph"><rect x="2" y="10" width="32" height="23" rx="7"/><path d="M18 10V3M0 18v9M36 18v9M11 33v5M25 33v5"/><circle cx="18" cy="2" r="2"/><circle cx="11" cy="20" r="2"/><circle cx="25" cy="20" r="2"/><path d="M12 27h12"/></g><text x="554" y="53" class="title" text-anchor="start">Agent</text><text x="507" y="91" class="small" text-anchor="start">Diagnose · design · execute</text><rect x="704" y="18" width="188" height="90" rx="12" class="sage" /><g transform="translate(719 42)" class="glyph"><circle cx="15" cy="15" r="12"/><path d="m23 24 12 12M8 15l5 5 9-10"/></g><text x="766" y="53" class="title" text-anchor="start">Audit</text><text x="719" y="91" class="small" text-anchor="start">Data · process · results</text><path d="M470 61H486" class="dashed" marker-end="url(#feedback-architecture-arrow)"/><path d="M682 61H698" class="dashed" marker-end="url(#feedback-architecture-arrow)"/><path d="M586 109V140" class="dashed" marker-end="url(#feedback-architecture-arrow)"/><rect x="20" y="150" width="226" height="414" rx="12" class="blue" /><text x="40" y="178" class="eyebrow" text-anchor="start">FEEDBACK SIGNALS</text><text x="40" y="210" class="title" text-anchor="start">What is being learned?</text><text x="40" y="231" class="label" text-anchor="start">Mathematics</text><text x="40" y="256" class="stat" text-anchor="start">0.3225 → 0.0885</text><text x="40" y="277" class="tiny" text-anchor="start">Falling divergence</text><text x="40" y="310" class="label" text-anchor="start">Computing</text><text x="40" y="335" class="stat" text-anchor="start">0.1421 → 0.0526</text><text x="40" y="356" class="tiny" text-anchor="start">Low divergence</text><text x="40" y="389" class="label" text-anchor="start">Arts &amp; media</text><text x="40" y="414" class="stat" text-anchor="start">0.2389 → 0.1735</text><text x="40" y="435" class="tiny" text-anchor="start">Fluctuating across windows</text><path d="M40 465H226" class="rule" /><text x="40" y="491" class="label" text-anchor="start">Data analysis</text><text x="40" y="515" class="label" text-anchor="start">Model pass rates</text><text x="40" y="539" class="label" text-anchor="start">Evaluation errors</text><text x="40" y="552" class="tiny" text-anchor="start">KL endpoints from recorded windows</text><rect x="280" y="150" width="490" height="414" rx="12" class="inner" /><text x="300" y="178" class="eyebrow" text-anchor="start">EXPERIMENT LOOP</text><g data-architecture-stage="0"><rect x="304" y="307" width="174" height="84" rx="12" class="box stage-frame" /><text x="320" y="331" class="title" text-anchor="start">Diagnose</text><text x="320" y="353" class="small" text-anchor="start">Locate gaps</text><text x="320" y="371" class="small" text-anchor="start">Review slices</text></g><g data-architecture-stage="1"><rect x="415" y="200" width="222" height="76" rx="12" class="box stage-frame" /><text x="431" y="224" class="title" text-anchor="start">Propose</text><text x="431" y="246" class="small" text-anchor="start">Target slice · data operation</text><text x="431" y="264" class="small" text-anchor="start">Training setup · comparison</text></g><g data-architecture-stage="2"><rect x="560" y="307" width="182" height="84" rx="12" class="box stage-frame" /><text x="576" y="331" class="title" text-anchor="start">Build &amp; test</text><text x="576" y="353" class="small" text-anchor="start">Process → train</text><text x="576" y="371" class="small" text-anchor="start">Evaluate the checkpoint</text></g><g data-architecture-stage="3"><rect x="415" y="438" width="222" height="76" rx="12" class="box stage-frame" /><text x="431" y="462" class="title" text-anchor="start">Retain</text><text x="431" y="484" class="small" text-anchor="start">Compare task-level results</text><text x="431" y="502" class="small" text-anchor="start">Reuse models and recipes</text></g><path d="M392 302C392 254 394 239 409 239" class="connector" marker-end="url(#feedback-architecture-arrow)"/><path d="M643 238C682 238 696 265 696 301" class="connector" marker-end="url(#feedback-architecture-arrow)"/><path d="M696 397C696 449 668 477 643 477" class="connector" marker-end="url(#feedback-architecture-arrow)"/><path d="M409 476C376 476 347 442 347 397" class="connector" marker-end="url(#feedback-architecture-arrow)"/><g transform="translate(504 338)" class="glyph"><path d="m18 1 17 9v19l-17 9L1 29V10Zm0 18 17-9M18 19 1 10M18 19v19"/></g><text x="523" y="398" class="tiny" text-anchor="middle">Model</text><text x="525" y="545" class="small" text-anchor="middle">A proposal records the intervention and comparison.</text><path d="M250 349H297" class="connector" marker-end="url(#feedback-architecture-arrow)"/><rect x="804" y="150" width="216" height="414" rx="12" class="sage" /><text x="824" y="178" class="eyebrow" text-anchor="start">CANDIDATE RESULTS</text><text x="824" y="210" class="title" text-anchor="start">Keep the evidence</text><rect x="824" y="235" width="176" height="60" rx="12" class="inner" /><text x="838" y="258" class="label" text-anchor="start">Branch A</text><text x="838" y="280" class="tiny" text-anchor="start">Useful checkpoint</text><rect x="824" y="311" width="176" height="60" rx="12" class="inner" /><text x="838" y="334" class="label" text-anchor="start">Branch B</text><text x="838" y="356" class="tiny" text-anchor="start">Complementary capability</text><rect x="824" y="387" width="176" height="60" rx="12" class="inner" /><text x="838" y="410" class="label" text-anchor="start">Branch C</text><text x="838" y="432" class="tiny" text-anchor="start">Revise the proposal</text><text x="824" y="498" class="label" text-anchor="start">Record why it worked,</text><text x="824" y="521" class="label" text-anchor="start">or why it did not.</text><text x="824" y="550" class="tiny" text-anchor="start">Checkpoints · recipes · findings</text><path d="M775 349H798" class="connector" marker-end="url(#feedback-architecture-arrow)"/><rect x="20" y="607" width="1000" height="98" rx="12" class="sand" /><text x="40" y="634" class="eyebrow" text-anchor="start">DATAJUICER-SANDBOX / EXECUTION</text><text x="40" y="663" class="title" text-anchor="start">Factory · Hook · Pipeline</text><text x="40" y="687" class="small" text-anchor="start">Processing, training and evaluation</text><path d="M316 628V688" class="rule" /><text x="330" y="650" class="label" text-anchor="start">Delete / downsample</text><text x="330" y="677" class="tiny" text-anchor="start">Reduce errors &amp; repetition</text><path d="M487 628V688" class="rule" /><text x="501" y="650" class="label" text-anchor="start">Filter / rebalance</text><text x="501" y="677" class="tiny" text-anchor="start">Target + background + replay</text><path d="M658 628V688" class="rule" /><text x="672" y="650" class="label" text-anchor="start">Audit / rewrite</text><text x="672" y="677" class="tiny" text-anchor="start">Repair conditions &amp; answers</text><path d="M829 628V688" class="rule" /><text x="843" y="650" class="label" text-anchor="start">Targeted synthesis</text><text x="843" y="677" class="tiny" text-anchor="start">Add missing judgments</text><path d="M650 570V601" class="connector" marker-end="url(#feedback-architecture-arrow)"/><text x="665" y="591" class="tiny" text-anchor="start">execute</text><path d="M390 601V570" class="connector" marker-end="url(#feedback-architecture-arrow)"/><text x="304" y="591" class="tiny" text-anchor="start">return results</text><rect x="20" y="741" width="1000" height="89" rx="12" class="neutral" /><g transform="translate(40 766)" class="glyph"><ellipse cx="18" cy="7" rx="16" ry="6"/><path d="M2 7v24c0 8 32 8 32 0V7M2 19c0 8 32 8 32 0"/></g><text x="94" y="769" class="eyebrow" text-anchor="start">DATAJUICER-PANEL / EXPERIMENT ASSETS</text><text x="94" y="802" class="label" text-anchor="start">Data versions · Parent models · Configurations · Results · Provenance · Memory</text><path d="M525 736V711" class="dashed" marker-end="url(#feedback-architecture-arrow)"/><path d="M1025 510H1032V787H1026" class="connector" marker-end="url(#feedback-architecture-arrow)"/><path d="M20 787H6V192H14" class="dashed" /><text x="20" y="860" class="small" text-anchor="start">Stored learning signals and experiment history inform the next proposal.</text></svg>
