<svg xmlns="http://www.w3.org/2000/svg" class="architecture-canvas" viewBox="0 0 1040 526" role="img" aria-labelledby="research-loop-title research-loop-desc">
<title id="research-loop-title">How feedback becomes the next experiment</title><desc id="research-loop-desc">Diagnose a capability gap, specify a proposal, build and evaluate candidates, and carry forward useful checkpoints, recipes and findings. Human researchers set the objectives, permitted data and budget.</desc>
<defs><marker id="research-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#8b7964" stroke-width="1.4" stroke-linejoin="round"/></marker></defs>
<style>.architecture-canvas text{font-family:Inter,Arial,sans-serif;fill:#46453c;font-weight:400}.architecture-canvas .label{font-size:14px}.architecture-canvas .small{font-size:12px;fill:#7f786a}.architecture-canvas .tiny{font-size:11px;fill:#7f786a}.architecture-canvas .title{font-size:17px;font-weight:550;letter-spacing:-.3px}.architecture-canvas .number{font-size:35px;fill:#8f5e3f;letter-spacing:-1px}.architecture-canvas .stat{font-size:17px;fill:#70583f}.architecture-canvas .eyebrow{font-size:10px;font-weight:600;letter-spacing:1.4px;fill:#8c735b}.architecture-canvas .mono{font-size:13px;font-family:ui-monospace,monospace;fill:#556964}.architecture-canvas .box{fill:#fbf9f3;stroke:#cfc7b8;stroke-width:1.2}.architecture-canvas .sage{fill:#f0f4ed;stroke:#a7b49d;stroke-width:1.2}.architecture-canvas .blue{fill:#eff4f3;stroke:#a0b5b6;stroke-width:1.2}.architecture-canvas .sand{fill:#faf2e6;stroke:#c7ac86;stroke-width:1.2}.architecture-canvas .neutral{fill:#f3f0e9;stroke:#bdb7a7;stroke-width:1.2}.architecture-canvas .inner{fill:#fffdf8;stroke:#dbd4c6;stroke-width:1}.architecture-canvas .connector{fill:none;stroke:#8b7964;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.architecture-canvas .dashed{fill:none;stroke:#9b9587;stroke-width:1.2;stroke-dasharray:5 5;stroke-linecap:round}.architecture-canvas .rule{stroke:#ddd6c8;stroke-width:1}.architecture-canvas .glyph{fill:none;stroke:#566968;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.architecture-canvas .stage-frame{transition:stroke .2s,fill .2s}.architecture-canvas .stage-frame.is-active{stroke:#a56440;stroke-width:2.3;fill:#f8ecdc}
</style>
<text x="20" y="30" class="eyebrow" text-anchor="start">A RESEARCH ROUND</text><text x="1020" y="30" class="label" text-anchor="end">Human: objectives, data scope and budget</text><rect x="20" y="60" width="460" height="178" rx="12" class="blue" /><text x="42" y="91" class="eyebrow" text-anchor="start">01</text><text x="80" y="92" class="title" text-anchor="start">Diagnose the gap</text><text x="42" y="132" class="label" text-anchor="start">Inspect errors and learning signals.</text><text x="42" y="159" class="label" text-anchor="start">Review the affected data slice.</text><path d="M42 179H458" class="rule" /><text x="42" y="209" class="stat" text-anchor="start">Evidence to investigate</text><rect x="560" y="60" width="460" height="178" rx="12" class="sand" /><text x="582" y="91" class="eyebrow" text-anchor="start">02</text><text x="620" y="92" class="title" text-anchor="start">Specify an experiment</text><text x="582" y="132" class="label" text-anchor="start">Choose data changes and training settings.</text><text x="582" y="159" class="label" text-anchor="start">Name the parent model and comparison.</text><path d="M582 179H998" class="rule" /><text x="582" y="209" class="stat" text-anchor="start">A testable proposal</text><rect x="560" y="287" width="460" height="178" rx="12" class="neutral" /><text x="582" y="318" class="eyebrow" text-anchor="start">03</text><text x="620" y="319" class="title" text-anchor="start">Build, train and evaluate</text><text x="582" y="359" class="label" text-anchor="start">Create the data version and train.</text><text x="582" y="386" class="label" text-anchor="start">Check target and retained capabilities.</text><path d="M582 406H998" class="rule" /><text x="582" y="436" class="stat" text-anchor="start">Results for each candidate</text><rect x="20" y="287" width="460" height="178" rx="12" class="sage" /><text x="42" y="318" class="eyebrow" text-anchor="start">04</text><text x="80" y="319" class="title" text-anchor="start">Choose what to carry forward</text><text x="42" y="359" class="label" text-anchor="start">Compare checkpoints and task-level results.</text><text x="42" y="386" class="label" text-anchor="start">Keep useful recipes and failed attempts.</text><path d="M42 406H458" class="rule" /><text x="42" y="436" class="stat" text-anchor="start">Starting points for the next round</text><path d="M486 150H554" class="connector" marker-end="url(#research-loop-arrow)"/><path d="M790 244V281" class="connector" marker-end="url(#research-loop-arrow)"/><path d="M554 376H486" class="connector" marker-end="url(#research-loop-arrow)"/><path d="M250 281V244" class="connector" marker-end="url(#research-loop-arrow)"/><text x="20" y="502" class="label" text-anchor="start">The next proposal uses the previous results. The diagram describes the procedure, not measured gains.</text></svg>
