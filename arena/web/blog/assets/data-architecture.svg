<svg xmlns="http://www.w3.org/2000/svg" class="architecture-canvas" viewBox="0 0 1040 436" role="img" aria-labelledby="data-architecture-title data-architecture-desc">
<title id="data-architecture-title">From source records to a training recipe</title><desc id="data-architecture-desc">Collect source records and environment tasks, check that the decisions are valid, then organize them with a shared schema and semantic tags. The record provides supervision; its tags connect learning feedback to future data selection.</desc>
<defs><marker id="data-architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#8b7964" stroke-width="1.4" stroke-linejoin="round"/></marker></defs>
<style>.architecture-canvas text{font-family:Inter,Arial,sans-serif;fill:#46453c;font-weight:400}.architecture-canvas .label{font-size:14px}.architecture-canvas .small{font-size:12px;fill:#7f786a}.architecture-canvas .tiny{font-size:11px;fill:#7f786a}.architecture-canvas .title{font-size:17px;font-weight:550;letter-spacing:-.3px}.architecture-canvas .number{font-size:35px;fill:#8f5e3f;letter-spacing:-1px}.architecture-canvas .stat{font-size:17px;fill:#70583f}.architecture-canvas .eyebrow{font-size:10px;font-weight:600;letter-spacing:1.4px;fill:#8c735b}.architecture-canvas .mono{font-size:13px;font-family:ui-monospace,monospace;fill:#556964}.architecture-canvas .box{fill:#fbf9f3;stroke:#cfc7b8;stroke-width:1.2}.architecture-canvas .sage{fill:#f0f4ed;stroke:#a7b49d;stroke-width:1.2}.architecture-canvas .blue{fill:#eff4f3;stroke:#a0b5b6;stroke-width:1.2}.architecture-canvas .sand{fill:#faf2e6;stroke:#c7ac86;stroke-width:1.2}.architecture-canvas .neutral{fill:#f3f0e9;stroke:#bdb7a7;stroke-width:1.2}.architecture-canvas .inner{fill:#fffdf8;stroke:#dbd4c6;stroke-width:1}.architecture-canvas .connector{fill:none;stroke:#8b7964;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.architecture-canvas .dashed{fill:none;stroke:#9b9587;stroke-width:1.2;stroke-dasharray:5 5;stroke-linecap:round}.architecture-canvas .rule{stroke:#ddd6c8;stroke-width:1}.architecture-canvas .glyph{fill:none;stroke:#566968;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.architecture-canvas .stage-frame{transition:stroke .2s,fill .2s}.architecture-canvas .stage-frame.is-active{stroke:#a56440;stroke-width:2.3;fill:#f8ecdc}
</style>
<rect x="20" y="20" width="308" height="244" rx="12" class="blue" /><text x="42" y="49" class="eyebrow" text-anchor="start">01 / COLLECT</text><g transform="translate(42 72)" class="glyph"><rect x="5" y="1" width="28" height="33" rx="4"/><path d="M11 10h16M11 17h16M11 24h10M1 8v30h25"/></g><text x="42" y="140" class="title" text-anchor="start">6.65M source records</text><text x="42" y="176" class="label" text-anchor="start">Classification, reasoning,</text><text x="42" y="202" class="label" text-anchor="start">preferences and tool use.</text><text x="42" y="228" class="label" text-anchor="start">Add tasks from environments.</text><rect x="366" y="20" width="308" height="244" rx="12" class="sand" /><text x="388" y="49" class="eyebrow" text-anchor="start">02 / CHECK</text><g transform="translate(388 72)" class="glyph"><path d="M1 3h34L23 20v12l-10 5V20Z"/><path d="M9 10h18"/></g><text x="388" y="140" class="title" text-anchor="start">Make the judgment valid</text><text x="388" y="176" class="label" text-anchor="start">Remove duplicates. Review answers,</text><text x="388" y="202" class="label" text-anchor="start">constraints and candidate bias.</text><text x="388" y="228" class="label" text-anchor="start">Check evaluation overlap.</text><rect x="712" y="20" width="308" height="244" rx="12" class="sage" /><text x="734" y="49" class="eyebrow" text-anchor="start">03 / ORGANIZE</text><g transform="translate(734 72)" class="glyph"><path d="M1 5h21l13 13-18 18L1 20Z"/><circle cx="10" cy="13" r="3"/><path d="m24 7 12 12"/></g><text x="734" y="140" class="title" text-anchor="start">Select what to learn</text><text x="734" y="176" class="label" text-anchor="start">Use one decision schema.</text><text x="734" y="202" class="label" text-anchor="start">Tag the domain and required ability.</text><text x="734" y="228" class="label" text-anchor="start">Select a recipe for the next run.</text><path d="M334 137H360" class="connector" marker-end="url(#data-architecture-arrow)"/><path d="M680 137H706" class="connector" marker-end="url(#data-architecture-arrow)"/><rect x="20" y="295" width="1000" height="89" rx="12" class="inner" /><text x="42" y="323" class="eyebrow" text-anchor="start">ONE RECORD, TWO USES</text><text x="42" y="354" class="title" text-anchor="start">State + candidates + labels → supervision</text><text x="560" y="354" class="title" text-anchor="start">Tags + learning feedback → data selection</text><text x="20" y="413" class="label" text-anchor="start">Source records are a starting pool. Each experiment uses a selected and processed training recipe.</text></svg>
