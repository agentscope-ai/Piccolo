services:
  jev:
    build: .
    image: blink-arena:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JEV_HTTP_PORT:-8080}:8080"
    environment:
      JEV_DATA_DIR: /data
      JEV_LEADERBOARD_DIR: /app/leaderboard
      JEV_PREFIX: ${JEV_PREFIX:-}
      JEV_ENGINE_PLUGINS: ${JEV_ENGINE_PLUGINS:-}
      JEV_ADMIN_TOKEN: ${JEV_ADMIN_TOKEN:-}
      # 后端端口仅发布到回环地址；信任同网络 Caddy 的 HTTPS 转发头。
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - jev-data:/data
      - jev-leaderboard:/app/leaderboard
    shm_size: "1gb"

  caddy:
    image: caddy:2-alpine
    profiles: ["domain"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      jev:
        condition: service_healthy

volumes:
  jev-data:
  jev-leaderboard:
  caddy-data:
  caddy-config:
