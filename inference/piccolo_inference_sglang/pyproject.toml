[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piccolo-inference-sglang"
version = "0.2.1"
description = "Piccolo text and vision inference for SGLang, with optional frozen PaddleOCR"
requires-python = ">=3.12"
dependencies = [
    "sglang==0.5.22",
    "transformers==5.19.0",
    "fastapi==0.141.1",
    "Pillow==11.3.0",
]

[project.optional-dependencies]
ocr = [
    "paddlepaddle-gpu==3.3.0",
    "paddleocr==3.7.0",
    "paddlex==3.7.2",
    "opencv-contrib-python==4.10.0.84",
    "numpy==2.2.6",
    "Pillow==11.3.0",
]

[tool.piccolo.ocr]
paddle-index-url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"

[project.entry-points."sglang.srt.plugins"]
piccolo = "piccolo_inference_sglang.plugin:register"

[tool.setuptools.packages.find]
include = ["piccolo_inference_sglang*"]

[tool.setuptools.package-data]
piccolo_inference_sglang = ["licenses/*.txt"]
