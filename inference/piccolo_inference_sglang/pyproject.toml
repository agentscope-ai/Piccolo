[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piccolo-inference-sglang"
version = "0.3.0"
description = "Portable Piccolo shared-depth multimodal decision inference for SGLang"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
inference = [
    "sglang==0.5.22",
    "transformers==5.19.0",
    "fastapi==0.141.1",
    "Pillow==11.3.0",
]
ocr = [
    "paddlepaddle-gpu==3.3.0",
    "paddleocr==3.7.0",
    "paddlex==3.7.2",
    "opencv-contrib-python==4.10.0.84",
    "numpy==2.2.6",
    "Pillow==11.3.0",
]

[tool.piccolo.ocr]
paddle-index-url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"

[project.entry-points."sglang.srt.plugins"]
piccolo = "piccolo_inference_sglang.plugin:register"

[project.scripts]
piccolo-serve = "piccolo_inference_sglang.launch:main"
piccolo-prepare-ocr = "piccolo_inference_sglang.prepare_ocr_models:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["piccolo_inference_sglang*"]
exclude = ["*__pycache__*"]
namespaces = false

[tool.setuptools.package-data]
piccolo_inference_sglang = ["licenses/*.txt", "profiles/*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]
