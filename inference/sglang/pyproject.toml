[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piccolo-inference-sglang"
version = "0.2.0"
description = "Independent Piccolo frozen-prompt scoring adapter for SGLang"
requires-python = ">=3.12"
dependencies = ["piccolo-hf", "fastapi>=0.115.0", "orjson>=3.10"]

[project.entry-points."sglang.srt.plugins"]
piccolo = "piccolo_inference_sglang.plugin:register"

[tool.setuptools.packages.find]
include = ["piccolo_inference_sglang*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
